<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Game + Редактор окон</title>
    
    <!-- Стили вашей игры -->
    <style>
        /* ВАШИ СТИЛИ ИГРЫ ЗДЕСЬ */
        /* Я вставлю их познее для экономии места */
        
        /* СТИЛИ РЕДАКТОРА */
        .editor-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 999999;
            display: none;
            backdrop-filter: blur(5px);
        }
        
        .editor-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        .editor-header {
            background: rgba(15, 23, 42, 0.95);
            padding: 15px 20px;
            border-bottom: 1px solid #475569;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .editor-tabs {
            display: flex;
            gap: 10px;
            background: rgba(30, 41, 59, 0.9);
            padding: 10px;
        }
        
        .editor-tab {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #475569;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .editor-tab.active {
            background: rgba(59, 130, 246, 0.3);
            border-color: #3b82f6;
        }
        
        .editor-main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        
        .game-preview {
            flex: 3;
            position: relative;
            background: #000;
            overflow: auto;
            border-right: 1px solid #475569;
        }
        
        .game-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }
        
        .editor-sidebar {
            width: 350px;
            background: rgba(30, 41, 59, 0.95);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .sidebar-section {
            padding: 20px;
            border-bottom: 1px solid #475569;
        }
        
        .window-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .window-item {
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .window-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .window-item.selected {
            background: rgba(59, 130, 246, 0.2);
            border-color: #3b82f6;
        }
        
        .properties-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .form-group label {
            font-size: 12px;
            color: #94a3b8;
            font-weight: 500;
        }
        
        .form-group input, .form-group select {
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #475569;
            border-radius: 6px;
            color: white;
        }
        
        .editor-controls {
            padding: 20px;
            border-top: 1px solid #475569;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .btn {
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: #3b82f6;
            color: white;
        }
        
        .btn-primary:hover {
            background: #2563eb;
        }
        
        .btn-success {
            background: #10b981;
            color: white;
        }
        
        .btn-success:hover {
            background: #059669;
        }
        
        .btn-warning {
            background: #f59e0b;
            color: white;
        }
        
        .btn-warning:hover {
            background: #d97706;
        }
        
        .resize-handle {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #3b82f6;
            border-radius: 50%;
            border: 2px solid white;
            cursor: pointer;
            z-index: 1000000;
        }
        
        .resize-nw { top: -6px; left: -6px; cursor: nw-resize; }
        .resize-ne { top: -6px; right: -6px; cursor: ne-resize; }
        .resize-sw { bottom: -6px; left: -6px; cursor: sw-resize; }
        .resize-se { bottom: -6px; right: -6px; cursor: se-resize; }
        .resize-n { top: -6px; left: 50%; transform: translateX(-50%); cursor: n-resize; }
        .resize-s { bottom: -6px; left: 50%; transform: translateX(-50%); cursor: s-resize; }
        .resize-w { top: 50%; left: -6px; transform: translateY(-50%); cursor: w-resize; }
        .resize-e { top: 50%; right: -6px; transform: translateY(-50%); cursor: e-resize; }
        
        .window-outline {
            position: absolute;
            border: 2px dashed #3b82f6;
            pointer-events: none;
            z-index: 999999;
            background: rgba(59, 130, 246, 0.1);
        }
        
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 20px 20px;
            pointer-events: none;
            z-index: 99999;
        }
        
        .element-info {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            pointer-events: none;
            z-index: 1000001;
        }
    </style>
</head>
<body>
    <!-- Кнопка активации редактора -->
    <button id="editor-toggle" style="
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: linear-gradient(135deg, #8b5cf6, #ec4899);
        color: white;
        border: none;
        font-size: 24px;
        cursor: pointer;
        z-index: 99999;
        box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);
        transition: all 0.3s ease;
    " title="Ctrl+Shift+E">
        🛠️
    </button>

    <!-- Оверлей редактора -->
    <div class="editor-overlay" id="editorOverlay">
        <div class="editor-container">
            <div class="editor-header">
                <h2 style="color: #60a5fa; margin: 0;">🎮 Редактор окон RPG</h2>
                <div>
                    <button class="btn btn-primary" onclick="saveLayout()">💾 Сохранить</button>
                    <button class="btn btn-warning" onclick="toggleEditor()" style="margin-left: 10px;">✕ Закрыть</button>
                </div>
            </div>
            
            <div class="editor-tabs">
                <div class="editor-tab active" onclick="setEditorMode('position')">📐 Позиционирование</div>
                <div class="editor-tab" onclick="setEditorMode('style')">🎨 Стили</div>
                <div class="editor-tab" onclick="setEditorMode('export')">📝 Экспорт</div>
            </div>
            
            <div class="editor-main">
                <!-- Превью игры -->
                <div class="game-preview" id="gamePreview">
                    <div class="grid-overlay" id="gridOverlay"></div>
                    <!-- Игра будет встроена сюда -->
                </div>
                
                <!-- Сайдбар редактора -->
                <div class="editor-sidebar">
                    <div class="sidebar-section">
                        <h3 style="color: #cbd5e1; margin-bottom: 15px;">🪟 Окна игры</h3>
                        <div class="window-list" id="windowList">
                            <!-- Окна загружаются динамически -->
                        </div>
                    </div>
                    
                    <div id="propertiesSection">
                        <!-- Свойства выбранного элемента -->
                    </div>
                    
                    <div class="editor-controls">
                        <button class="btn btn-success" onclick="exportCSS()">📁 Экспорт CSS</button>
                        <button class="btn btn-warning" onclick="resetLayout()">🔄 Сбросить</button>
                        <button class="btn" onclick="toggleGrid()" id="gridToggle">📐 Сетка</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Контейнер для игры -->
    <div id="gameContainer"></div>

    <script>
        // ========== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ==========
        let editorMode = 'position';
        let selectedElement = null;
        let isDragging = false;
        let isResizing = false;
        let dragOffset = { x: 0, y: 0 };
        let resizeData = null;
        let gridVisible = true;
        let windows = [];
        
        // Определения окон вашей игры
        const GAME_WINDOWS = [
            {
                id: 'hero-screen',
                name: 'Экран героя',
                selector: '.hero-game-screen',
                type: 'fullscreen',
                defaultStyles: {}
            },
            {
                id: 'battle-screen',
                name: 'Боевой экран',
                selector: '.battle-screen-fullscreen',
                type: 'fullscreen',
                defaultStyles: {}
            },
            {
                id: 'map-overlay',
                name: 'Тактическая карта',
                selector: '.tactical-map-overlay',
                type: 'overlay',
                defaultStyles: {}
            },
            {
                id: 'top-bar',
                name: 'Верхняя панель',
                selector: '.top-action-bar',
                type: 'panel',
                defaultStyles: {}
            },
            {
                id: 'hero-main',
                name: 'Основная область героя',
                selector: '.hero-main-window-v2',
                type: 'panel',
                defaultStyles: {}
            },
            {
                id: 'equipment-left',
                name: 'Левая экипировка',
                selector: '.equipment-column-v2.left-column',
                type: 'panel',
                defaultStyles: {}
            },
            {
                id: 'equipment-right',
                name: 'Правая экипировка',
                selector: '.equipment-column-v2.right-column',
                type: 'panel',
                defaultStyles: {}
            },
            {
                id: 'item-modal',
                name: 'Модальное окно предмета',
                selector: '.item-detail-modal',
                type: 'modal',
                defaultStyles: {}
            },
            {
                id: 'shop-overlay',
                name: 'Магазин',
                selector: '.shop-overlay',
                type: 'overlay',
                defaultStyles: {}
            }
        ];

        // ========== ИНИЦИАЛИЗАЦИЯ ==========
        function init() {
            // Загружаем игру
            loadGame();
            
            // Инициализируем редактор
            setupEditor();
            
            // Загружаем сохраненные настройки
            loadSavedLayout();
            
            // Вешаем горячие клавиши
            setupHotkeys();
            
            console.log('🎮 Редактор инициализирован');
        }

        // ========== ЗАГРУЗКА ИГРЫ ==========
        function loadGame() {
            const gameContainer = document.getElementById('gameContainer');
            
            // Создаем iframe с игрой
            const gameFrame = document.createElement('iframe');
            gameFrame.id = 'gameFrame';
            gameFrame.src = 'https://stalegradov.github.io/Tigrimion/'; // Укажите путь к вашей игре
            gameFrame.style.cssText = `
                width: 100%;
                height: 100%;
                border: none;
                position: fixed;
                top: 0;
                left: 0;
                z-index: 1;
            `;
            
            gameContainer.appendChild(gameFrame);
            
            // Ждем загрузки игры
            gameFrame.onload = () => {
                console.log('✅ Игра загружена');
                scanGameWindows();
            };
        }

        // ========== СКАНИРОВАНИЕ ОКОН ИГРЫ ==========
        function scanGameWindows() {
            const gameDoc = document.getElementById('gameFrame').contentDocument;
            windows = [];
            
            GAME_WINDOWS.forEach(windowDef => {
                const element = gameDoc.querySelector(windowDef.selector);
                if (element) {
                    const rect = element.getBoundingClientRect();
                    const styles = window.getComputedStyle(element);
                    
                    const windowData = {
                        ...windowDef,
                        element: element,
                        x: rect.left,
                        y: rect.top,
                        width: rect.width,
                        height: rect.height,
                        visible: styles.display !== 'none',
                        styles: {
                            position: styles.position,
                            left: styles.left,
                            top: styles.top,
                            width: styles.width,
                            height: styles.height,
                            backgroundColor: styles.backgroundColor,
                            border: styles.border,
                            borderRadius: styles.borderRadius,
                            zIndex: styles.zIndex
                        }
                    };
                    
                    windows.push(windowData);
                    console.log(`📊 Найдено окно: ${windowDef.name}`);
                }
            });
            
            updateWindowList();
            showWindowOutlines();
        }

        // ========== ИНТЕРФЕЙС РЕДАКТОРА ==========
        function setupEditor() {
            // Кнопка переключения редактора
            document.getElementById('editor-toggle').addEventListener('click', toggleEditor);
            
            // Инициализируем табы
            setEditorMode('position');
            
            // Вешаем обработчики на превью
            const preview = document.getElementById('gamePreview');
            preview.addEventListener('mousedown', handlePreviewMouseDown);
            preview.addEventListener('mousemove', handlePreviewMouseMove);
            preview.addEventListener('mouseup', handlePreviewMouseUp);
        }

        function toggleEditor() {
            const overlay = document.getElementById('editorOverlay');
            const isVisible = overlay.style.display === 'flex';
            
            overlay.style.display = isVisible ? 'none' : 'flex';
            
            if (!isVisible) {
                // При открытии редактора обновляем данные
                scanGameWindows();
            }
        }

        function setEditorMode(mode) {
            editorMode = mode;
            
            // Обновляем активные табы
            document.querySelectorAll('.editor-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Обновляем контент
            updatePropertiesSection();
        }

        function updateWindowList() {
            const list = document.getElementById('windowList');
            list.innerHTML = '';
            
            windows.forEach(win => {
                const item = document.createElement('div');
                item.className = `window-item ${selectedElement?.id === win.id ? 'selected' : ''}`;
                item.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-weight: 500;">${win.name}</span>
                        <span style="font-size: 11px; color: #94a3b8;">
                            ${win.visible ? '👁️' : '👻'} ${win.width}x${win.height}
                        </span>
                    </div>
                `;
                
                item.addEventListener('click', () => selectWindow(win));
                list.appendChild(item);
            });
        }

        function selectWindow(window) {
            selectedElement = window;
            updateWindowList();
            showWindowOutlines();
            updatePropertiesSection();
            
            // Показываем информацию о выбранном окне
            console.log(`✅ Выбрано: ${window.name}`);
        }

        function showWindowOutlines() {
            // Удаляем старые контуры
            document.querySelectorAll('.window-outline, .resize-handle').forEach(el => el.remove());
            
            windows.forEach(win => {
                if (!win.element || !win.visible) return;
                
                const outline = document.createElement('div');
                outline.className = 'window-outline';
                outline.id = `outline-${win.id}`;
                outline.style.cssText = `
                    left: ${win.x}px;
                    top: ${win.y}px;
                    width: ${win.width}px;
                    height: ${win.height}px;
                    ${selectedElement?.id === win.id ? 'border-color: #10b981; background: rgba(16, 185, 129, 0.1);' : ''}
                `;
                
                document.getElementById('gamePreview').appendChild(outline);
                
                // Для выбранного элемента добавляем ручки изменения размера
                if (selectedElement?.id === win.id) {
                    createResizeHandles(outline, win);
                    
                    // Показываем информацию
                    const info = document.createElement('div');
                    info.className = 'element-info';
                    info.id = `info-${win.id}`;
                    info.style.cssText = `
                        left: ${win.x}px;
                        top: ${win.y - 30}px;
                    `;
                    info.textContent = `${win.name} (${win.width}x${win.height})`;
                    document.getElementById('gamePreview').appendChild(info);
                }
            });
        }

        function createResizeHandles(outline, window) {
            const positions = ['nw', 'ne', 'sw', 'se', 'n', 's', 'w', 'e'];
            
            positions.forEach(pos => {
                const handle = document.createElement('div');
                handle.className = `resize-handle resize-${pos}`;
                handle.dataset.direction = pos;
                handle.addEventListener('mousedown', (e) => startResize(e, window));
                outline.appendChild(handle);
            });
        }

        // ========== ПЕРЕТАСКИВАНИЕ И РАЗМЕРЫ ==========
        function handlePreviewMouseDown(e) {
            if (!selectedElement) return;
            
            const target = e.target;
            
            // Проверяем, нажали ли на ручку изменения размера
            if (target.classList.contains('resize-handle')) {
                startResize(e, selectedElement);
                return;
            }
            
            // Проверяем, нажали ли на контур окна
            if (target.classList.contains('window-outline')) {
                startDrag(e, selectedElement);
                return;
            }
        }

        function startDrag(e, window) {
            e.preventDefault();
            isDragging = true;
            dragOffset = {
                x: e.clientX - window.x,
                y: e.clientY - window.y
            };
            
            document.addEventListener('mousemove', handleDrag);
            document.addEventListener('mouseup', stopDrag);
        }

        function handleDrag(e) {
            if (!isDragging || !selectedElement) return;
            
            const newX = e.clientX - dragOffset.x;
            const newY = e.clientY - dragOffset.y;
            
            // Обновляем позицию окна
            selectedElement.x = newX;
            selectedElement.y = newY;
            selectedElement.element.style.left = `${newX}px`;
            selectedElement.element.style.top = `${newY}px`;
            selectedElement.element.style.position = 'absolute';
            
            // Обновляем контур
            const outline = document.getElementById(`outline-${selectedElement.id}`);
            if (outline) {
                outline.style.left = `${newX}px`;
                outline.style.top = `${newY}px`;
            }
            
            // Обновляем информацию
            const info = document.getElementById(`info-${selectedElement.id}`);
            if (info) {
                info.style.left = `${newX}px`;
                info.style.top = `${newY - 30}px`;
            }
            
            updatePropertiesSection();
        }

        function stopDrag() {
            isDragging = false;
            document.removeEventListener('mousemove', handleDrag);
            document.removeEventListener('mouseup', stopDrag);
        }

        function startResize(e, window) {
            e.preventDefault();
            e.stopPropagation();
            
            isResizing = true;
            const direction = e.target.dataset.direction;
            
            resizeData = {
                window,
                direction,
                startX: e.clientX,
                startY: e.clientY,
                startWidth: window.width,
                startHeight: window.height,
                startLeft: window.x,
                startTop: window.y
            };
            
            document.addEventListener('mousemove', handleResize);
            document.addEventListener('mouseup', stopResize);
        }

        function handleResize(e) {
            if (!isResizing || !resizeData) return;
            
            const dx = e.clientX - resizeData.startX;
            const dy = e.clientY - resizeData.startY;
            const window = resizeData.window;
            
            let newWidth = resizeData.startWidth;
            let newHeight = resizeData.startHeight;
            let newX = window.x;
            let newY = window.y;
            
            switch (resizeData.direction) {
                case 'e':
                    newWidth = Math.max(50, resizeData.startWidth + dx);
                    break;
                case 'w':
                    newWidth = Math.max(50, resizeData.startWidth - dx);
                    newX = resizeData.startLeft + dx;
                    break;
                case 's':
                    newHeight = Math.max(50, resizeData.startHeight + dy);
                    break;
                case 'n':
                    newHeight = Math.max(50, resizeData.startHeight - dy);
                    newY = resizeData.startTop + dy;
                    break;
                case 'se':
                    newWidth = Math.max(50, resizeData.startWidth + dx);
                    newHeight = Math.max(50, resizeData.startHeight + dy);
                    break;
                case 'sw':
                    newWidth = Math.max(50, resizeData.startWidth - dx);
                    newHeight = Math.max(50, resizeData.startHeight + dy);
                    newX = resizeData.startLeft + dx;
                    break;
                case 'ne':
                    newWidth = Math.max(50, resizeData.startWidth + dx);
                    newHeight = Math.max(50, resizeData.startHeight - dy);
                    newY = resizeData.startTop + dy;
                    break;
                case 'nw':
                    newWidth = Math.max(50, resizeData.startWidth - dx);
                    newHeight = Math.max(50, resizeData.startHeight - dy);
                    newX = resizeData.startLeft + dx;
                    newY = resizeData.startTop + dy;
                    break;
            }
            
            // Обновляем размеры окна
            window.width = newWidth;
            window.height = newHeight;
            window.x = newX;
            window.y = newY;
            
            window.element.style.width = `${newWidth}px`;
            window.element.style.height = `${newHeight}px`;
            window.element.style.left = `${newX}px`;
            window.element.style.top = `${newY}px`;
            
            // Обновляем контур
            const outline = document.getElementById(`outline-${window.id}`);
            if (outline) {
                outline.style.width = `${newWidth}px`;
                outline.style.height = `${newHeight}px`;
                outline.style.left = `${newX}px`;
                outline.style.top = `${newY}px`;
            }
            
            // Обновляем информацию
            const info = document.getElementById(`info-${window.id}`);
            if (info) {
                info.textContent = `${window.name} (${newWidth}x${newHeight})`;
                info.style.left = `${newX}px`;
                info.style.top = `${newY - 30}px`;
            }
            
            updatePropertiesSection();
        }

        function stopResize() {
            isResizing = false;
            resizeData = null;
            document.removeEventListener('mousemove', handleResize);
            document.removeEventListener('mouseup', stopResize);
        }

        function handlePreviewMouseMove(e) {
            if (isDragging || isResizing) {
                return;
            }
            
            // Можно добавить подсветку при наведении
        }

        function handlePreviewMouseUp() {
            stopDrag();
            stopResize();
        }

        // ========== ПАНЕЛЬ СВОЙСТВ ==========
        function updatePropertiesSection() {
            const section = document.getElementById('propertiesSection');
            
            if (!selectedElement) {
                section.innerHTML = `
                    <div class="sidebar-section">
                        <h3 style="color: #cbd5e1;">⚙️ Свойства</h3>
                        <div style="color: #94a3b8; text-align: center; padding: 40px 20px;">
                            Выберите окно для редактирования
                        </div>
                    </div>
                `;
                return;
            }
            
            section.innerHTML = `
                <div class="sidebar-section">
                    <h3 style="color: #cbd5e1; margin-bottom: 15px;">⚙️ ${selectedElement.name}</h3>
                    
                    <div class="properties-form">
                        ${editorMode === 'position' ? getPositionProperties() : ''}
                        ${editorMode === 'style' ? getStyleProperties() : ''}
                        ${editorMode === 'export' ? getExportProperties() : ''}
                    </div>
                </div>
            `;
            
            // Вешаем обработчики на инпуты
            if (editorMode === 'position') {
                document.getElementById('propX').addEventListener('input', updatePositionFromInput);
                document.getElementById('propY').addEventListener('input', updatePositionFromInput);
                document.getElementById('propWidth').addEventListener('input', updateSizeFromInput);
                document.getElementById('propHeight').addEventListener('input', updateSizeFromInput);
            }
            
            if (editorMode === 'style') {
                document.getElementById('propBgColor').addEventListener('input', updateStyleFromInput);
                document.getElementById('propBorder').addEventListener('input', updateStyleFromInput);
                document.getElementById('propRadius').addEventListener('input', updateStyleFromInput);
            }
        }

        function getPositionProperties() {
            return `
                <div class="form-group">
                    <label>Позиция X</label>
                    <input type="number" id="propX" value="${selectedElement.x}">
                </div>
                
                <div class="form-group">
                    <label>Позиция Y</label>
                    <input type="number" id="propY" value="${selectedElement.y}">
                </div>
                
                <div class="form-group">
                    <label>Ширина</label>
                    <input type="number" id="propWidth" value="${selectedElement.width}">
                </div>
                
                <div class="form-group">
                    <label>Высота</label>
                    <input type="number" id="propHeight" value="${selectedElement.height}">
                </div>
                
                <div class="form-group">
                    <label>Видимость</label>
                    <select id="propVisibility" onchange="toggleVisibility()">
                        <option value="visible" ${selectedElement.visible ? 'selected' : ''}>Видимо</option>
                        <option value="hidden" ${!selectedElement.visible ? 'selected' : ''}>Скрыто</option>
                    </select>
                </div>
            `;
        }

        function getStyleProperties() {
            return `
                <div class="form-group">
                    <label>Цвет фона</label>
                    <input type="color" id="propBgColor" value="#1f2937">
                </div>
                
                <div class="form-group">
                    <label>Рамка</label>
                    <input type="text" id="propBorder" value="1px solid #475569">
                </div>
                
                <div class="form-group">
                    <label>Скругление углов</label>
                    <input type="text" id="propRadius" value="8px">
                </div>
                
                <div class="form-group">
                    <label>Z-Index</label>
                    <input type="number" id="propZIndex" value="${selectedElement.styles.zIndex || 1}">
                </div>
                
                <button class="btn btn-primary" onclick="applyStyles()">Применить стили</button>
            `;
        }

        function getExportProperties() {
            return `
                <div class="form-group">
                    <label>Имя класса CSS</label>
                    <input type="text" id="cssClassName" value="${selectedElement.selector.replace('.', '')}">
                </div>
                
                <div class="form-group">
                    <label>Комментарий</label>
                    <textarea id="cssComment" rows="3" placeholder="Описание изменений..."></textarea>
                </div>
                
                <button class="btn btn-success" onclick="generateCSS()">📄 Сгенерировать CSS</button>
                
                <div id="cssOutput" style="
                    margin-top: 20px;
                    padding: 15px;
                    background: rgba(0,0,0,0.3);
                    border-radius: 6px;
                    font-family: monospace;
                    font-size: 12px;
                    white-space: pre-wrap;
                    display: none;
                "></div>
            `;
        }

        function updatePositionFromInput() {
            const x = parseInt(document.getElementById('propX').value) || 0;
            const y = parseInt(document.getElementById('propY').value) || 0;
            const width = parseInt(document.getElementById('propWidth').value) || 100;
            const height = parseInt(document.getElementById('propHeight').value) || 100;
            
            selectedElement.x = x;
            selectedElement.y = y;
            selectedElement.width = width;
            selectedElement.height = height;
            
            selectedElement.element.style.left = `${x}px`;
            selectedElement.element.style.top = `${y}px`;
            selectedElement.element.style.width = `${width}px`;
            selectedElement.element.style.height = `${height}px`;
            
            showWindowOutlines();
        }

        function updateSizeFromInput() {
            updatePositionFromInput();
        }

        function toggleVisibility() {
            const select = document.getElementById('propVisibility');
            const visible = select.value === 'visible';
            
            selectedElement.visible = visible;
            selectedElement.element.style.display = visible ? 'block' : 'none';
            
            showWindowOutlines();
        }

        function applyStyles() {
            const bgColor = document.getElementById('propBgColor').value;
            const border = document.getElementById('propBorder').value;
            const radius = document.getElementById('propRadius').value;
            const zIndex = document.getElementById('propZIndex').value;
            
            selectedElement.element.style.backgroundColor = bgColor;
            selectedElement.element.style.border = border;
            selectedElement.element.style.borderRadius = radius;
            selectedElement.element.style.zIndex = zIndex;
            
            selectedElement.styles.backgroundColor = bgColor;
            selectedElement.styles.border = border;
            selectedElement.styles.borderRadius = radius;
            selectedElement.styles.zIndex = zIndex;
        }

        // ========== ЭКСПОРТ И СОХРАНЕНИЕ ==========
        function saveLayout() {
            const layout = {
                windows: windows.map(win => ({
                    id: win.id,
                    name: win.name,
                    selector: win.selector,
                    x: win.x,
                    y: win.y,
                    width: win.width,
                    height: win.height,
                    styles: win.styles,
                    visible: win.visible
                })),
                timestamp: new Date().toISOString(),
                version: '1.0'
            };
            
            localStorage.setItem('rpg_window_layout', JSON.stringify(layout, null, 2));
            
            alert('✅ Layout сохранен в localStorage!');
        }

        function loadSavedLayout() {
            try {
                const saved = localStorage.getItem('rpg_window_layout');
                if (saved) {
                    const layout = JSON.parse(saved);
                    
                    layout.windows.forEach(savedWin => {
                        const win = windows.find(w => w.id === savedWin.id);
                        if (win && win.element) {
                            win.x = savedWin.x;
                            win.y = savedWin.y;
                            win.width = savedWin.width;
                            win.height = savedWin.height;
                            win.styles = savedWin.styles;
                            win.visible = savedWin.visible;
                            
                            // Применяем к элементу
                            win.element.style.left = `${savedWin.x}px`;
                            win.element.style.top = `${savedWin.y}px`;
                            win.element.style.width = `${savedWin.width}px`;
                            win.element.style.height = `${savedWin.height}px`;
                            win.element.style.display = savedWin.visible ? 'block' : 'none';
                            
                            // Применяем стили
                            if (savedWin.styles) {
                                Object.keys(savedWin.styles).forEach(key => {
                                    win.element.style[key] = savedWin.styles[key];
                                });
                            }
                        }
                    });
                    
                    console.log('✅ Загружен сохраненный layout');
                    showWindowOutlines();
                }
            } catch (e) {
                console.warn('Не удалось загрузить layout:', e);
            }
        }

        function exportCSS() {
            let css = `/* CSS позиционирование окон RPG игры */\n/* Сгенерировано редактором ${new Date().toLocaleString()} */\n\n`;
            
            windows.forEach(win => {
                if (!win.visible) return;
                
                css += `${win.selector} {\n`;
                css += `    /* ${win.name} */\n`;
                css += `    position: absolute;\n`;
                css += `    left: ${win.x}px;\n`;
                css += `    top: ${win.y}px;\n`;
                css += `    width: ${win.width}px;\n`;
                css += `    height: ${win.height}px;\n`;
                css += `    z-index: ${win.styles.zIndex || 1};\n`;
                
                if (win.styles.backgroundColor) {
                    css += `    background-color: ${win.styles.backgroundColor};\n`;
                }
                
                if (win.styles.border) {
                    css += `    border: ${win.styles.border};\n`;
                }
                
                if (win.styles.borderRadius) {
                    css += `    border-radius: ${win.styles.borderRadius};\n`;
                }
                
                css += `}\n\n`;
            });
            
            // Создаем и скачиваем файл
            const blob = new Blob([css], { type: 'text/css' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `rpg-windows-${new Date().getTime()}.css`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            
            alert('✅ CSS экспортирован!');
        }

        function generateCSS() {
            const className = document.getElementById('cssClassName').value;
            const comment = document.getElementById('cssComment').value;
            
            let css = `.${className} {\n`;
            if (comment) css += `    /* ${comment} */\n`;
            css += `    position: absolute;\n`;
            css += `    left: ${selectedElement.x}px;\n`;
            css += `    top: ${selectedElement.y}px;\n`;
            css += `    width: ${selectedElement.width}px;\n`;
            css += `    height: ${selectedElement.height}px;\n`;
            
            if (selectedElement.styles.backgroundColor) {
                css += `    background-color: ${selectedElement.styles.backgroundColor};\n`;
            }
            
            if (selectedElement.styles.border) {
                css += `    border: ${selectedElement.styles.border};\n`;
            }
            
            if (selectedElement.styles.borderRadius) {
                css += `    border-radius: ${selectedElement.styles.borderRadius};\n`;
            }
            
            css += `    z-index: ${selectedElement.styles.zIndex || 1};\n`;
            css += `}\n`;
            
            const output = document.getElementById('cssOutput');
            output.textContent = css;
            output.style.display = 'block';
        }

        function resetLayout() {
            if (confirm('Сбросить все изменения к исходным?')) {
                windows.forEach(win => {
                    if (win.element) {
                        win.element.style.left = '';
                        win.element.style.top = '';
                        win.element.style.width = '';
                        win.element.style.height = '';
                        win.element.style.position = '';
                        win.element.style.display = 'block';
                    }
                });
                
                localStorage.removeItem('rpg_window_layout');
                scanGameWindows();
                alert('✅ Layout сброшен!');
            }
        }

        function toggleGrid() {
            gridVisible = !gridVisible;
            const grid = document.getElementById('gridOverlay');
            grid.style.display = gridVisible ? 'block' : 'none';
            
            const button = document.getElementById('gridToggle');
            button.textContent = gridVisible ? '📐 Сетка' : '📐 Сетка';
        }

        // ========== ГОРЯЧИЕ КЛАВИШИ ==========
        function setupHotkeys() {
            document.addEventListener('keydown', (e) => {
                // Ctrl+Shift+E - переключение редактора
                if (e.ctrlKey && e.shiftKey && e.key === 'E') {
                    toggleEditor();
                    e.preventDefault();
                }
                
                // Ctrl+S - сохранить
                if (e.ctrlKey && e.key === 's') {
                    saveLayout();
                    e.preventDefault();
                }
                
                // Delete - сбросить выбранное окно
                if (e.key === 'Delete' && selectedElement) {
                    selectedElement.element.style.left = '';
                    selectedElement.element.style.top = '';
                    selectedElement.element.style.width = '';
                    selectedElement.element.style.height = '';
                    scanGameWindows();
                }
                
                // Стрелки для точной настройки
                if (selectedElement && !e.ctrlKey && !e.shiftKey) {
                    let dx = 0, dy = 0;
                    
                    switch(e.key) {
                        case 'ArrowUp': dy = -1; break;
                        case 'ArrowDown': dy = 1; break;
                        case 'ArrowLeft': dx = -1; break;
                        case 'ArrowRight': dx = 1; break;
                    }
                    
                    if (dx !== 0 || dy !== 0) {
                        selectedElement.x += dx;
                        selectedElement.y += dy;
                        selectedElement.element.style.left = `${selectedElement.x}px`;
                        selectedElement.element.style.top = `${selectedElement.y}px`;
                        showWindowOutlines();
                        updatePropertiesSection();
                        e.preventDefault();
                    }
                }
            });
        }

        // ========== ЗАПУСК ==========
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
